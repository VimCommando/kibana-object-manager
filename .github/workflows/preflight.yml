name: Preflight
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install validation tools
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo +1.97.1 install okf --version 0.2.7 --locked
          cargo +1.97.1 install tq-cli --version 0.3.0 --locked
          npm install --global @fission-ai/openspec@1.11.0
          sudo apt-get update
          sudo apt-get install --yes shellcheck ripgrep
      - name: Local preflight
        run: bash scripts/preflight.sh
      - name: Pull request contract
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check_pr.sh --base "$PR_BASE" --head "$PR_HEAD" --event "$GITHUB_EVENT_PATH"
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: bash scripts/preflight.sh msrv
